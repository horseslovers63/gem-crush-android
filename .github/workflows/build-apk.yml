
name: Build Gem Crush APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
           cd www
           npm install
             

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gem-Crush-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
